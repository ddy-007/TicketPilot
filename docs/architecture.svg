<svg xmlns="http://www.w3.org/2000/svg" width="1280" height="780" viewBox="0 0 1280 780" role="img" aria-labelledby="title desc">
<title id="title">TicketPilot 架构</title><desc id="desc">浏览器提交诊断与审批，单 Worker 运行 LangGraph，只读模型经过服务端审批控制调用幂等模拟业务服务，PostgreSQL 保存业务状态与检查点。</desc>
<defs><marker id="arrow" markerWidth="10" markerHeight="10" refX="8" refY="3" orient="auto"><path d="M0 0L9 3L0 6" fill="#52778c"/></marker></defs>
<rect width="1280" height="780" rx="20" fill="#f0f5f8"/>
<g font-family="Microsoft YaHei,Arial,sans-serif" fill="#17384b"><text x="55" y="65" font-size="32" font-weight="700">TicketPilot</text><text x="270" y="65" font-size="20">可审批、可恢复的履约重试 Agent</text><text x="55" y="100" font-size="16" fill="#526c7d">单场景 · 单 Worker · 合成业务 · 本地演示身份</text></g>
<g fill="none" stroke="#52778c" stroke-width="2.5" marker-end="url(#arrow)"><path d="M305 210H410"/><path d="M730 210H875"/><path d="M1155 250H1175V395H1010V420"/><path d="M875 480H730"/><path d="M410 480H305"/><path d="M305 515H410"/><path d="M730 450H765V340H785"/><path d="M1155 450H1195V220H1155"/><path d="M570 540V605"/><path d="M730 655H1010V540"/></g>
<g stroke="#c6d6df" stroke-width="1.5"><rect x="55" y="155" width="250" height="110" rx="14" fill="#fff"/><rect x="410" y="145" width="320" height="130" rx="14" fill="#fff"/><rect x="875" y="145" width="280" height="130" rx="14" fill="#dcedf6"/><rect x="875" y="420" width="280" height="120" rx="14" fill="#dcedf6"/><rect x="410" y="420" width="320" height="120" rx="14" fill="#fff"/><rect x="55" y="420" width="250" height="120" rx="14" fill="#fff"/><rect x="410" y="605" width="320" height="105" rx="14" fill="#fff"/><rect x="785" y="300" width="350" height="80" rx="12" fill="#fff4da"/></g>
<g font-family="Microsoft YaHei,Arial,sans-serif" text-anchor="middle" fill="#17384b"><g font-size="21" font-weight="700"><text x="180" y="195">浏览器工作台</text><text x="570" y="187">FastAPI API</text><text x="1015" y="187">应用 PostgreSQL</text><text x="1015" y="465">单 Worker</text><text x="570" y="462">LangGraph</text><text x="180" y="462">真实模型供应商</text><text x="570" y="643">模拟业务 HTTP API</text></g><g font-size="16"><text x="180" y="227">操作员 / 审批员</text><text x="570" y="220">角色校验 · 创建幂等 · 审批哈希</text><text x="570" y="246">只保存决定，不直接写业务</text><text x="1015" y="222">Run / Job / Approval</text><text x="1015" y="246">Operation / 证据 / 事件</text><text x="1015" y="500">持久队列 · 有界恢复</text><text x="570" y="496">查证 → 提案 → interrupt → 恢复</text><text x="180" y="497">三个只读工具，无写工具</text><text x="570" y="677">稳定幂等键 · 版本检查 · 原子写入</text><text x="960" y="333" font-weight="700">PostgreSQL checkpoint</text><text x="960" y="360">图位置与中断持久化，支持跨进程恢复</text></g></g>
<g font-family="Microsoft YaHei,Arial,sans-serif" font-size="14" fill="#526c7d"><text x="410" y="585">执行前：正式批准、哈希一致、未过期、版本未变化</text><text x="815" y="610">写后查证 / 未知结果保留 UNKNOWN</text><text x="55" y="747">FAILED → QUEUED 只表示重新入队；不表示已经发货。模型供应商当前 HTTP 402，真实 M5 test 待完成。</text></g>
</svg>
