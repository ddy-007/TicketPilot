name: CI

on:
  push:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  lint:
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: astral-sh/setup-uv@07a047e608db84b3d8c06cd9a7c7dcc9c355c18e # v10.3.2
        with:
          version: '0.12.3'
          python-version: '3.12'
      - run: uv sync --directory backend --locked
      - run: uv run --directory backend --locked ruff check app migrations tests simulator evaluation ../scripts
      - run: uv run --directory backend --locked ruff format --check app migrations tests simulator evaluation ../scripts
      - run: uv run --project backend --locked python scripts/check_privacy.py

  backend:
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    strategy:
      fail-fast: false
      matrix:
        python: ['3.11', '3.12']
    services:
      postgres:
        image: postgres:16-alpine@sha256:721873c34ceb9f8d8fc265984940dc982404c105f19ad51be9fdc5970a6080ea
        env:
          POSTGRES_USER: ticketpilot
          POSTGRES_PASSWORD: local-dev-only
          POSTGRES_DB: postgres
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U ticketpilot -d postgres"
          --health-interval 3s --health-timeout 3s --health-retries 20
    env:
      M0_TEST_ADMIN_URL: postgresql://ticketpilot:local-dev-only@127.0.0.1:5432/postgres
      APP_DATABASE_URL: postgresql+psycopg://ticketpilot:local-dev-only@127.0.0.1:5432/postgres
      CHECKPOINT_DATABASE_URL: postgresql://ticketpilot:local-dev-only@127.0.0.1:5432/postgres
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: astral-sh/setup-uv@07a047e608db84b3d8c06cd9a7c7dcc9c355c18e # v10.3.2
        with:
          version: '0.12.3'
          python-version: ${{ matrix.python }}
      - run: uv sync --directory backend --locked
      - name: Backend unit and isolated PostgreSQL integration tests
        run: uv run --directory backend --locked pytest -q --junitxml=../artifacts/backend.xml
      - name: Require zero skipped tests
        run: uv run --directory backend --locked python ../scripts/check_ci_results.py --junit ../artifacts/backend.xml
      - name: Generate fresh fixed-flow report and rescore that report
        if: matrix.python == '3.12'
        run: |
          uv run --directory backend --locked python -m evaluation.run --baseline fixed --split all --output ../artifacts/fixed.json
          uv run --directory backend --locked python -m evaluation.rescore --input ../artifacts/fixed.json --output ../artifacts/fixed-rescored.json
          uv run --directory backend --locked python ../scripts/check_ci_results.py --junit ../artifacts/backend.xml --report ../artifacts/fixed.json --rescored ../artifacts/fixed-rescored.json
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7
        if: always()
        with:
          name: backend-${{ matrix.python }}
          path: |
            artifacts/backend.xml
            artifacts/fixed.json
            artifacts/fixed-rescored.json
          retention-days: 14
          if-no-files-found: warn

  frontend:
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    defaults:
      run:
        working-directory: frontend
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7
        with:
          node-version: '22.23.2'
          package-manager-cache: false
      - run: npm ci --ignore-scripts --no-audit --no-fund
      - run: npm run typecheck
      - run: npm test
      - run: npm run build
