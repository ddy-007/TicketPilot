name: Manual real model evaluation

on:
  workflow_dispatch:
    inputs:
      confirm_paid:
        description: 'I authorize paid requests (call limit is not a currency limit)'
        required: true
        type: boolean
        default: false
      split:
        description: 'Run dev first; freeze source and prompt before test'
        required: true
        type: choice
        options: [dev, test]
        default: dev
      max_model_calls:
        description: 'Total call cap, 1..72; use 24 for dev or 72 for test'
        required: true
        type: string
        default: '1'

permissions:
  contents: read

concurrency:
  group: paid-model-evaluation
  cancel-in-progress: false

jobs:
  evaluate:
    if: inputs.confirm_paid && github.ref == 'refs/heads/main'
    environment: model-evaluation
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    services:
      postgres:
        image: postgres:16-alpine@sha256:721873c34ceb9f8d8fc265984940dc982404c105f19ad51be9fdc5970a6080ea
        env:
          POSTGRES_USER: ticketpilot
          POSTGRES_PASSWORD: local-dev-only
          POSTGRES_DB: postgres
        ports: ['5432:5432']
        options: >-
          --health-cmd "pg_isready -U ticketpilot -d postgres"
          --health-interval 3s --health-timeout 3s --health-retries 20
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: astral-sh/setup-uv@07a047e608db84b3d8c06cd9a7c7dcc9c355c18e # v10.3.2
        with:
          version: '0.12.3'
          python-version: '3.12'
      - run: uv sync --directory backend --locked
      - name: Validate call cap
        env:
          CALL_CAP: ${{ inputs.max_model_calls }}
        run: |
          uv run --directory backend --locked python -c 'import os; n=os.environ["CALL_CAP"]; assert n.isascii() and n.isdecimal() and 1 <= int(n) <= 72, "call cap must be 1..72"'
      - name: Run real evaluation; stop on provider errors
        env:
          CALL_CAP: ${{ inputs.max_model_calls }}
          EVAL_SPLIT: ${{ inputs.split }}
          M0_TEST_ADMIN_URL: postgresql://ticketpilot:local-dev-only@127.0.0.1:5432/postgres
          APP_DATABASE_URL: postgresql+psycopg://ticketpilot:local-dev-only@127.0.0.1:5432/postgres
          CHECKPOINT_DATABASE_URL: postgresql://ticketpilot:local-dev-only@127.0.0.1:5432/postgres
          LLM_BASE_URL: ${{ secrets.LLM_BASE_URL }}
          LLM_MODEL: ${{ secrets.LLM_MODEL }}
          LLM_API_KEY: ${{ secrets.LLM_API_KEY }}
        run: uv run --directory backend --locked python -m evaluation.run --baseline agent --split "$EVAL_SPLIT" --real-model --max-model-calls "$CALL_CAP" --output ../artifacts/model.json
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7
        if: always()
        with:
          name: model-${{ github.run_id }}-${{ github.run_attempt }}
          path: artifacts/model.json
          retention-days: 14
          if-no-files-found: warn
